runtime: python312
entrypoint: gunicorn -b :$PORT -w 1 -t 210 app:server

# instance_class: F2 (optional)
automatic_scaling:
  min_instances: 1
  max_instances: 1

env_variables:
  # --- Basics / logging ---
  TZ: "Asia/Seoul"
  LOG_LEVEL: "INFO"
  LOG_DIR: "/tmp/trading_bot"
  GUNICORN_CMD_ARGS: "--timeout 210 --graceful-timeout 30"

  # --- Execution ---
  EXECUTE_TRADES: "true"
  SYMBOLS: "BTCUSDT,ETHUSDT"

  # --- Model / calibration ---
  GEMINI_MODEL: "gemini-2.5-flash-lite"
  SHADOW_MODELS: "gemini-2.5-flash"
  USE_CALIBRATED_PROB: "true"
  PROB_CALIBRATION_PATH: "/tmp/trading_bot/calibration.json"
  CALIB_MIN_SAMPLES: "400"
  CALIB_BINS: "20"
  MIN_VOL_FRAC: "0.00025"

  # --- EV / RR / risk gates ---
  RR_GATE_MODE: "expected"  # worst|expected|best
  MIN_PROB: "0.62"
  PROB_RELAX_THRESHOLD: "0.78"
  RR_MIN: "1.30"
  RR_MIN_HIGH_PROB: "1.08"
  RR_EVAL_WITH_FEES: "true"
  EV_MIN_PERC: "0.0001"
  MAX_SPREAD_BPS: "2.5"
  HORIZON_MIN: "45"
  TIME_BARRIER_ENABLED: "true"

  # --- EV override (tight defaults) ---
  EV_OVERRIDE_ENABLED: "true"
  EV_OVERRIDE_MIN_PROB: "0.58"
  EV_OVERRIDE_MIN_PERC: "0.0005"  # relaxed from 0.0015
  MTF_RELAX_WITH_EV: "false"
  OVR_SPREAD_MAX_BPS: "1.8"
  OVR_RR_EXTRA: "0.05"

  # --- Dynamic ATR / volatility ---
  DYN_ATR_LEVELS: "true"
  VOL_TRANQ_RATIO: "1.10"   # raised from 0.70 to apply tranq more often
  VOL_TURB_RATIO: "1.30"
  TP_FUDGE_TRANQ: "2.00"     # increased from 1.10
  SL_FUDGE_TRANQ: "0.85"     # tightened from 0.90
  TP_FUDGE_TURB: "0.90"
  SL_FUDGE_TURB: "1.10"

  # --- MTF / shock / cooldown ---
  MTF_ALIGN_ENABLED: "true"
  MTF_RSI_LONG_MIN: "52"
  MTF_RSI_SHORT_MAX: "48"
  SHOCK_BPS: "30"
  SHOCK_ATR_MULT: "1.8"
  ENTRY_COOLDOWN_MIN: "20"

  # --- Orders ---
  ATR_MULT_SL: "1.1"
  ATR_MULT_TP: "2.4"
  TP_ORDER_TYPE: "LIMIT"
  SL_ORDER_TYPE: "STOP_MARKET"
  SL_LIMIT_SLIPPAGE_BPS: "10"

  # --- Entry behavior ---
  ENTRY_MODE: "LIMIT"
  ENTRY_POST_ONLY: "true"
  LIMIT_TTL_SEC: "25"
  LIMIT_POLL_SEC: "1.0"
  LIMIT_MAX_REPRICES: "2"
  LIMIT_MAX_SLIPPAGE_BPS: "2.0"
  LIMIT_TTL_FALLBACK_TO_MARKET: "true"

  # --- Predictor selection ---
  PREDICTOR_BACKEND: "GEMINI"        # set to TSFM to enable TS-FM backend or GEMINI
  # PREDICTOR_IMPL: "TSFM_CHRONOS"   # also supported for legacy compatibility
  # TSFM_ENDPOINT_URL: ""            # optional remote endpoint for TSFM quantiles
  # TSFM_MODEL_NAME: "amazon/chronos-bolt-tiny"
  # TSFM_DEVICE: "cpu"
  # TSFM_N_PATHS: "256"
  LIMIT_FAILOVER_TO_MARKET: "true"

  # --- Break-even trailing ---
  BE_TRAILING_ENABLED: "true"
  BE_TRIGGER_R_MULT: "1.0"
  BE_OFFSET_TICKS: "2"

  # --- Sizing / leverage ---
  SIZE_MODE: "USDT"
  RISK_USDT: "50"
  RISK_BAL_PCT: "1.50"
  SIZE_BAL_INCLUDE_UPNL: "false"
  LEVERAGE: "5"
  MARGIN_TYPE: "ISOLATED"
  POSITION_MODE: "ONEWAY"
  POSITION_SIDE: "BOTH"
  VOL_SIZE_SCALING: "true"
  VOL_LOOKBACK: "60"
  VOL_SCALAR_MIN: "0.5"
  VOL_SCALAR_MAX: "1.25"

  # --- Maker-prob estimation ---
  MAKER_PROB_LOOKBACK: "200"
  MAKER_PROB_PRIOR_A: "3"
  MAKER_PROB_PRIOR_B: "3"

  # --- Journal / GCS ---
  JOURNAL_SYNC_ON_START: "true"
  EXIT_SEARCH_BACK_MS: "10800000"
  GCS_BUCKET: "tothemoon-v2-logs-vaulted-scholar-466013-r5-seoul"
  GCS_PREFIX: "trading_bot"

  # --- HTTP ---
  BINANCE_HTTP_TIMEOUT_MS: "10000"
  BINANCE_HTTP_RETRIES: "3"
  BINANCE_HTTP_BACKOFF_MS: "1000"

  # --- Fees (bps) ---
  FEE_MAKER_BPS: "2.0"
  FEE_TAKER_BPS: "4.0"

  # --- Frontend (optional) ---
  FRONTEND_BASE_URL: ""

vpc_access_connector:
  name: projects/vaulted-scholar-466013-r5/locations/asia-northeast3/connectors/appengine-conn2
  egress_setting: all-traffic

handlers:
- url: /.*
  script: auto
